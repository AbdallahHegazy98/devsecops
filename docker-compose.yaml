version: "3.9"

services:
  db:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notespassword

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: notes-api

    ports:
      - "5000:5000"

    depends_on:
      - db

    environment:
      DATABASE_URL: postgresql://notesuser:notespassword@db/notes

volumes:
  postgres_data: